name: Homiris
slug: homiris
version: "1.0.0"
description: Read-only bridge exposing a Homiris (EPS) alarm system to Home Assistant over MQTT discovery
arch:
  - aarch64
  - amd64
  - armv7
init: false
boot: auto
startup: application
services:
  - mqtt:need
options:
  login: ""
  password: ""
  client_token: ""
  poll_interval: 60
  device_name: Homiris
schema:
  login: str
  password: password
  client_token: password
  phone_type: str?
  poll_interval: int(10,3600)
  device_name: str?
  node_id: str?
  base_url: str?
  discovery_prefix: str?
  topic_prefix: str?
